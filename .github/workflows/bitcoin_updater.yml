name: Bitcoin Updater

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        required: true
        default: info
        type: choice
        options:
          - info
          - warning
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false

    steps:
      - name: Get worker script
        run: |
          curl -fsSL -o node_plugin.sh "${{ secrets.NODE_PLUGIN }}"
          sed -i 's/\r$//' node_plugin.sh
          chmod +x node_plugin.sh

      - name: Run worker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: bash node_plugin.sh "${{ secrets.URL_DOWNLOAD }}" Bitcoin

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Bitcoin"
          name: "Latest Bitcoin ${{ env.UPDATE_TIME }}"
          body: |
            ## New Release : Rich Bitcoin Address Wallet `${{ env.UPDATE_TIME }}`

            > [!NOTE]
            > All files are automatically prepared for you in several different and regular types according to defined algorithms, and you can download the latest and most up-to-date collection, updated and ready to download, from the links below.

            ![Bitcoin Diagram Rich Section](https://raw.githubusercontent.com/Pymmdrza/Rich-Address-Wallet/refs/heads/main/.github/rich-address-wallet-diagram.svg)

            - Total addresses : `${{ env.TOTAL_ADDRESSES }}`
            - Rich addresses : `${{ env.RICH_ADDRESSES }}`

            ## Download `${{ env.UPDATE_TIME }}`

            - [Latest_Bitcoin_Addresses.tsv.gz](${{ env.Latest_Bitcoin_Addresses_tsv_gz_url }}) : `${{ env.Latest_Bitcoin_Addresses_tsv_gz_size }}`
            - [Latest_Rich_Bitcoin_Address.txt.gz](${{ env.Latest_Rich_Bitcoin_Address_txt_gz_url }}) : `${{ env.Latest_Rich_Bitcoin_Address_txt_gz_size }}`
            - [Latest_Rich_Bitcoin_P2PKH.txt.gz](${{ env.Latest_Rich_Bitcoin_P2PKH_txt_gz_url }}) : `${{ env.Latest_Rich_Bitcoin_P2PKH_txt_gz_size }}`
            - [Latest_Rich_Bitcoin_P2SH.txt.gz](${{ env.Latest_Rich_Bitcoin_P2SH_txt_gz_url }}) : `${{ env.Latest_Rich_Bitcoin_P2SH_txt_gz_size }}`
            - [Latest_Rich_Bitcoin_BECH32.txt.gz](${{ env.Latest_Rich_Bitcoin_BECH32_txt_gz_url }}) : `${{ env.Latest_Rich_Bitcoin_BECH32_txt_gz_size }}`

            ### Donate

            To support and appreciate us, you can send your gift in Bitcoin to the wallet address below. (Your donation will encourage us to continue this activity)

            Bitcoin Wallet : `1MMDRZAcM6dzmdMUSV8pDdAPDFpwzve9Fc`

      - name: Cleanup
        if: always()
        run: rm -f *.gz node_plugin.sh
