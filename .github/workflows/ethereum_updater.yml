
name: Ethereum Updater

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ethereum-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check requests lxml

      - name: Download and run Ethereum updater
        shell: bash
        env:
          NODE_PLUGIN_URL: ${{ secrets.NEW_ETH_NODE_PLUGIN_URL }}
          ETH_WORKERS: '3'
          ETH_REQUEST_INTERVAL: '0.4'
        run: |
          set -euo pipefail

          if [[ -z "${NODE_PLUGIN_URL:-}" ]]; then
            echo "::error::Missing secret NEW_ETH_NODE_PLUGIN_URL"
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 30 \
            --output "$RUNNER_TEMP/ethereum_updater.py" "$NODE_PLUGIN_URL"

          python -u "$RUNNER_TEMP/ethereum_updater.py"

      - name: Validate datasets and Markdown pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import os
          import re
          from pathlib import Path

          root = Path('ETHEREUM')
          readme = root / 'README.md'
          pages = sorted((root / 'balance-ranges').glob('*/part-*.md'))
          expected = int(os.environ['TOTAL_ADDRESSES'])
          max_bytes = 400 * 1024
          rows = 0
          addresses = set()
          pattern = re.compile(r'^\| `(0x[a-fA-F0-9]{40})` \| (\d+(?:\.\d+)?) \| \[view\]\(https://etherscan\.io/address/\1\) \|$')

          assert expected == 10000, f'Expected 10000 source addresses, got {expected}'
          assert readme.is_file() and readme.stat().st_size <= max_bytes
          assert len(pages) == int(os.environ['MARKDOWN_PAGES']) > 0
          assert readme.read_text(encoding='utf-8').count('[Part ') == len(pages)

          for page in pages:
              assert 0 < page.stat().st_size <= max_bytes, f'Invalid page size: {page}'
              for line in page.read_text(encoding='utf-8').splitlines():
                  if not line.startswith('| `0x'):
                      continue
                  match = pattern.fullmatch(line)
                  assert match, f'Invalid table row: {page}'
                  address = match.group(1).lower()
                  assert address not in addresses, f'Duplicate address: {address}'
                  addresses.add(address)
                  rows += 1

          assert rows == expected, f'Markdown rows: {rows}, expected {expected}'

          output = Path('ethereum_release_assets')
          for name in ('Latest_Rich_Ethereum_Addresses.txt.gz',
                       'Latest_Rich_Ethereum_Balances.txt.gz'):
              file = output / name
              assert file.is_file() and 0 < file.stat().st_size < 2147483648
              with gzip.open(file, 'rt', encoding='utf-8') as stream:
                  data = [line.rstrip('\n') for line in stream]
              assert len(data) == expected, f'GZIP row count invalid: {file}'
              if 'Balances' in name:
                  assert {row.split('\t', 1)[0].lower() for row in data} == addresses
              else:
                  assert {row.lower() for row in data} == addresses
          print(f'Validated {expected} addresses across {len(pages)} Markdown files')
          PY

      - name: Create or update Ethereum release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Ethereum
          name: Latest Ethereum ${{ env.UPDATE_TIME }}
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ethereum_release_assets/Latest_Rich_Ethereum_Addresses.txt.gz
            ethereum_release_assets/Latest_Rich_Ethereum_Balances.txt.gz
          body: |
            ## New Release : Rich Ethereum Address Wallet `${{ env.UPDATE_TIME }}`

            > [!NOTE]
            > The latest Ethereum top accounts and full ETH balances are available below.

            - Total addresses: `${{ env.TOTAL_ADDRESSES }}`
            - Rich addresses: `${{ env.RICH_ADDRESSES }}`
            - Source pages: `${{ env.SOURCE_PAGES }}`
            - Balance ranges: `${{ env.BALANCE_RANGES }}`
            - Markdown table files: `${{ env.MARKDOWN_PAGES }}`

            ## Download `${{ env.UPDATE_TIME }}`

            - [Latest_Rich_Ethereum_Addresses.txt.gz](${{ env.Latest_Rich_Ethereum_Addresses_txt_gz_url }}) : `${{ env.Latest_Rich_Ethereum_Addresses_txt_gz_size }}`
            - [Latest_Rich_Ethereum_Balances.txt.gz](${{ env.Latest_Rich_Ethereum_Balances_txt_gz_url }}) : `${{ env.Latest_Rich_Ethereum_Balances_txt_gz_size }}`

            ## Browse by Balance

            [Browse all balance ranges and Markdown tables](https://github.com/Pymmdrza/Rich-Address-Wallet/blob/main/ETHEREUM/README.md).

            ### Donate

            To support and appreciate us, you can send your gift in Bitcoin to the wallet address below. (Your donation will encourage us to continue this activity)

            Bitcoin Wallet : `1MMDRZAcM6dzmdMUSV8pDdAPDFpwzve9Fc`

      - name: Commit Ethereum Markdown files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ETHEREUM/README.md ETHEREUM/balance-ranges/

          if git diff --cached --quiet; then
            echo "Ethereum Markdown files are unchanged"
          else
            git commit -m "docs(ethereum): refresh grouped balance tables"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup generated assets
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/ethereum_updater.py"
          rm -rf -- ethereum_release_assets
